name: Test and Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  unitTest:
    name: Testes Unitários e de API
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Instala as dependências da API
        working-directory: api
        run: npm ci

      - name: Roda os testes
        working-directory: api
        run: npm run test

      - name: Gera relatório de testes
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JEST Tests
          path: ./api/junit.xml
          reporter: jest-junit

  e2eTest:
    name: Testes Funcionais (E2E)
    runs-on: ubuntu-latest
    needs: unitTest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala dependências da API
        working-directory: api
        run: npm ci

      - name: Instala dependências do App
        working-directory: app
        run: npm ci

      - name: Instala dependências dos testes E2E
        working-directory: e2e-tests
        run: npm ci

      - name: Sobe a API em background
        working-directory: api
        run: npm start &

      - name: Sobe o App em background
        working-directory: app
        run: npm start &

      - name: Aguarda serviços ficarem prontos
        run: npx wait-on http://localhost:3001/health http://localhost:3000/login --timeout 30000

      - name: Roda testes E2E
        working-directory: e2e-tests
        run: node tests/base.test.js

      - name: Salva screenshots como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-tests/screenshots/
